<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Registration Form</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: Arial, sans-serif;
        }
        table {
            border: 1px solid #000;
            padding: 20px;
            background-color: #f9f9f9;
            border-radius: 10px;
            box-shadow: 0px 0px 10px #aaa;
        }
        th {
            font-size: 20px;
        }
    </style>
</head>
<body>
    <div class="form-container">
        <form action="#" method="POST" id="dockerForm" action="http://localhost:5000/submit">
            <table>
                <tr>
                    <th colspan=3>Docker Project Form</th>
                </tr>
                <tr>
                    <td colspan="3"><hr></td>
                </tr>
                <tr>
                    <th colspan="3">Personal Details:</th>
                </tr>
                <tr>
                    <td colspan=2>Student Name:</td>
                </tr>
                <tr>
                    <td>
                        <input id="name" type="text" name="name" required />
                    </td>
                </tr>
                <tr>
                    <td>Phone Number:</td>
                </tr>
                <tr>
                    <td>
                        <input type="text" id="phone" name="phone_no"  required />
                    </td>
                </tr>
                <tr>
                    <td>
                        <input type="password" id="password" name="password" required />
                    </td>
                </tr>
            </table>
        </form>
    </div>
</body>
</html>
